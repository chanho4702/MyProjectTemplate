events {}

http {
    log_format capacity '$time_iso8601 upstream=$upstream_addr '
                        'upstream_status=$upstream_status status=$status '
                        'request_time=$request_time request="$request"';

    access_log /var/log/nginx/access.log capacity;

    upstream sample_service_capacity_pool {
        server host.docker.internal:8081 max_fails=1 fail_timeout=2s;
        server host.docker.internal:8083 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        location = /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 'UP\n';
        }

        location / {
            proxy_pass http://sample_service_capacity_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
