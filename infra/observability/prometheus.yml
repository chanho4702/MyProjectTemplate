global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: platform-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]
        labels:
          service: gateway-service
          environment: local
      - targets: [host.docker.internal:8081]
        labels:
          service: sample-service
          environment: local
